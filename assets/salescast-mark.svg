  <rect x="5.5" y="5.5" width="53" height="53" rx="17" fill="#111827" stroke="#2DD4BF" stroke-opacity=".28"/>
  <circle class="pulse-ring" cx="32" cy="32" r="23" stroke="url(#mark-gradient)" stroke-opacity=".58"/>
  <path d="M17 43.5h30" stroke="#94A3B8" stroke-opacity=".48" stroke-linecap="round"/>
