<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="mark-gradient" x1="12" y1="52" x2="52" y2="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="mark-glow" x="0" y="0" width="64" height="64" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <style>
      .pulse-ring { transform-origin: 32px 32px; animation: ring-pulse 4s ease-in-out infinite; }
      .chart-stroke { stroke-dasharray: 74; stroke-dashoffset: 74; animation: chart-draw 1.35s cubic-bezier(.2,.7,.2,1) .18s forwards; }
      @keyframes chart-draw { to { stroke-dashoffset: 0; } }
      @keyframes ring-pulse { 0%, 100% { opacity: .28; transform: scale(.97); } 50% { opacity: .58; transform: scale(1.03); } }
      @media (prefers-reduced-motion: reduce) {
        .pulse-ring, .chart-stroke { animation: none; }
        .pulse-ring { opacity: .38; transform: none; }
        .chart-stroke { stroke-dashoffset: 0; }
      }
    </style>
